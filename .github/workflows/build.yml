name: Build game

# src/build.js joins src/page.html + src/style.css + src/js/*.js into one file.
# PRs: build + syntax check, and attach the built game as a downloadable artifact.
# main: bump the build number, fill it into CHANGELOG.md, rebuild index.html and publish it (Pages serves main).
on:
  push:
    branches: [main]
    paths: ['src/**', 'CHANGELOG.md', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'CHANGELOG.md', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump build number
        if: github.event_name != 'pull_request'
        run: echo $(( $(cat src/buildnum.txt) + 1 )) > src/buildnum.txt

      - name: Build
        run: node src/build.js

      - name: Check scripts parse
        run: node src/check.js

      - name: Attach built game to the PR run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: src/last-call-brawl.html

      - name: Publish index.html
        if: github.event_name != 'pull_request'
        run: |
          cp src/last-call-brawl.html index.html
          N=$(cat src/buildnum.txt)
          if [ -f CHANGELOG.md ]; then sed -i "/^## [0-9]/s/(build ?)/(build $N)/g" CHANGELOG.md; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/buildnum.txt CHANGELOG.md
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Build $(cat src/buildnum.txt)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
